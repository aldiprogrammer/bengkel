<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline · POS Bengkel</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <style>
        :root {
            --brand-500: #22c55e;
            --brand-600: #16a34a;
            --brand-700: #15803d;
            --brand-950: #052e16;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system,
                'Segoe UI', Roboto, sans-serif;
            color: #0f172a;
            background:
                radial-gradient(circle at 15% 15%, rgba(34, 197, 94, 0.18), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(21, 128, 61, 0.16), transparent 45%),
                #f1f5f9;
        }

        .card {
            width: 100%;
            max-width: 420px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 0 24px 60px -30px rgba(2, 44, 34, 0.45);
        }

        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 20px;
            box-shadow: 0 16px 30px -12px rgba(5, 46, 22, 0.5);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        h1 {
            margin: 18px 0 0;
            font-size: 22px;
            font-weight: 700;
        }

        p {
            margin: 10px 0 0;
            font-size: 14px;
            line-height: 1.6;
            color: #64748b;
        }

        button {
            margin-top: 26px;
            width: 100%;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 14px 26px -14px rgba(5, 46, 22, 0.7);
        }

        button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <main class="card">
        <img class="logo" src="/icons/icon-192.png" alt="POS Bengkel" width="72" height="72">
        <span class="badge">● Tidak ada koneksi</span>
        <h1>Anda sedang offline</h1>
        <p>
            Sepertinya koneksi internet terputus. Periksa jaringan Anda lalu coba
            muat ulang halaman ini.
        </p>
        <button type="button" onclick="window.location.reload()">Muat Ulang</button>
    </main>
</body>
</html>
